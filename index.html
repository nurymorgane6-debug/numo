tdr:{t:'TDR Architectes',lieu:'Valence',an:2026,
 role:{fr:'Stagiaire en agence d’architecture',en:'Architecture intern'},soft:'Archicad',cr:'Atelier TDR Architectes',
 sub:{fr:'Stage en agence d’architecture',en:'Internship in an architecture firm'},
 p:{fr:['Deux mois de stage, en mai et juin 2026, à l’Atelier TDR Architectes à Valence, entre l’agence et le chantier. À l’agence, j’ai travaillé en amont sur Archicad&nbsp;: modifications de permis de construire, du plan de masse existant au plan de masse projeté, évolutions du projet, plans, maquettes et visuels de présentation.','Sur le terrain, j’ai suivi le chantier et participé aux réunions de chantier avec les entreprises, la partie que j’ai préférée. Voir un bâtiment prendre forme, des voiles béton à la charpente bois, m’a appris à relier chaque trait dessiné à ce qui se construit vraiment.'],
 en:['A two-month internship, in May and June 2026, at Atelier TDR Architectes in Valence, split between the office and the building site. At the office, I worked upstream in Archicad: amended building permits, from the existing to the proposed site plan, design changes, plans, models and presentation visuals.','On site, I followed the works and took part in site meetings with the contractors, the part I loved most. Watching a building take shape, from the concrete walls to the timber frame, taught me to connect every line I draw to what actually gets built.']}},
perriere:{t:'Innesto',lieu:'Mercurey',pal:['8A5A3C','6B6B3A','D9C7A8','3A2A20'],acc:'d9c7a8',
 sub:{fr:'Duplex d’étudiant',en:'Student duplex'},
 p:{fr:['À Mercurey, un duplex d’étudiant se reconstruit autour d’une seule intervention&nbsp;: une greffe de bois clair et de métal noir qui relie les deux niveaux. Le claustra, l’escalier et le mobilier intégré se prolongent et forment un seul geste.','Les ouvertures rondes du claustra cadrent les vues sans fermer l’espace, la lumière le traverse, et la tête de lit en arche, d’un brun cuivré, réchauffe la chambre. L’existant reste en place&nbsp;; la greffe lui répond par ses matières et ses formes affirmées.'],
 en:['In Mercurey, a student duplex is rebuilt around a single intervention: a graft of light wood and black metal that ties the two levels together. The claustra screen, the staircase and the built-in furniture extend one another and read as one gesture.','The round openings of the screen frame the views without closing off the space, light passes through, and the arched headboard in coppery brown warms the bedroom. The existing structure stays in place; the graft answers it with assertive materials and shapes.']}},
aurae:{t:'Aurae',lieu:'Lyon',pal:['5A0F14','B08D57','120A0A','8C4A2F'],acc:'b08d57',
 sub:{fr:'Bar à cocktails et parfumerie',en:'Cocktail bar and perfumery'},
 p:{fr:['Aurae est un bar à cocktails qui s’ouvre sur une parfumerie&nbsp;: on y vient pour un verre, on en repart avec une odeur en tête. Au centre, un comptoir circulaire se tient sous de grands abat-jour cylindriques d’un rouge profond, dont le cœur ambré brille comme une braise.','Tout se joue sur l’ombre&nbsp;: bois sombre, surfaces satinées, filets de laiton, et un carrelage graphique qui dessine le parcours au sol. La lumière ne remplit pas la pièce, elle la sculpte, et le visiteur y avance comme dans un rituel.'],
 en:['Aurae is a cocktail bar that opens onto a perfumery: you come for a drink and leave with a scent in mind. At the center, a circular counter sits beneath large cylindrical shades in deep red, whose amber core glows like an ember.','Everything plays on shadow: dark wood, satin surfaces, brass lines, and a graphic tiled floor that draws the route. Light does not fill the room, it sculpts it, and the visitor moves through it as in a ritual.']}},
tchin:{t:'Tchin Tchin',lieu:'Lyon',pal:['7A1F1A','C49A6C','2B1D16','A67C52'],acc:'c49a6c',
 sub:{fr:'Concept bar',en:'Concept bar'},
 p:{fr:['Tchin Tchin fait de l’art de trinquer un lieu. Le comptoir est le cœur de la salle, avec ses étagères de bouteilles, son mur à vin et ses suspensions rouges&nbsp;; en façade, un imprimé léopard donne au meuble un côté sauvage et chaleureux.','Le bois clair apaise, le rouge réveille, l’imprimé fait sourire. Des gradins et des tabourets invitent à s’asseoir à plusieurs, et chaque coin a son rythme, du verre à deux jusqu’à la soirée qui s’emballe.'],
 en:['Tchin Tchin turns the art of the toast into a place. The counter is the heart of the room, with its shelves of bottles, its wine wall and its red pendant lights; on the front, a leopard print gives the piece a wild, warm side.','Light wood soothes, red wakes things up, the print makes you smile. Stepped seating and stools invite groups to sit together, and every corner has its own rhythm, from a quiet drink for two to an evening that takes off.']}},
sweet:{t:'Dolce',lieu:'Lyon',an:2025,pal:['E8A9B5','9ED8C8','5B3A2E','F3D9DE'],acc:'e8a9b5',
 sub:{fr:'Chambre d’hôtel immersive',en:'Immersive hotel room'},
 p:{fr:['Dolce transforme une chambre d’hôtel en souvenir de goûter&nbsp;: un chariot de confiseur blanc sous son auvent rayé, un petit frigo vert d’eau sorti d’une cuisine d’autrefois, des murs rose poudré.','Dans la salle de bains, des carreaux roses et des vasques rondes comme des donuts, l’une rose, l’autre vert d’eau. Les suspensions chromées reflètent la pièce comme des bonbons&nbsp;: c’est gourmand, mais le dessin reste précis et sur mesure.'],
 en:['Dolce turns a hotel room into a memory of afternoon snack time: a white confectioner’s cart under its striped awning, a small sea-green fridge from a kitchen of the past, powder-pink walls.','In the bathroom, pink tiles and round basins shaped like donuts, one pink, one sea green. The chrome pendants reflect the room like candy: it is sweet, but the drawing stays precise and custom-made.']}},
bobine:{t:'Scena',lieu:'Lyon',an:2024,pal:['4A0D12','D4AF6A','1A0F0D','7A5232'],acc:'d4af6a',
 sub:{fr:'Cinéma et bar immersif',en:'Cinema and immersive bar'},
 p:{fr:['Scena commence par une fausse supérette. Une porte discrète ouvre sur un couloir bordeaux, une enseigne CINEMA cernée d’ampoules, et une salle des années 70-80 que rien ne laissait deviner depuis la rue.','Le bar joue l’entracte&nbsp;: comptoir en lames de bois, lustres d’ampoules dorées, machine à pop-corn, tabourets vintage. Chaque détail prolonge le film, et la soirée ne s’arrête pas quand l’écran s’éteint.'],
 en:['Scena begins with a fake convenience store. A discreet door opens onto a burgundy corridor, a CINEMA sign ringed with bulbs, and a 1970s-80s screening room that nothing in the street gave away.','The bar plays the intermission: a slatted wood counter, chandeliers of golden bulbs, a popcorn machine, vintage stools. Every detail extends the film, and the evening does not stop when the screen goes dark.']}},
lumo:{t:'Lumo',lieu:'Musée des Beaux-Arts de Lyon',an:2025,pal:['1A5A9C','E8343A','F2D21B','D9A877'],acc:'f2d21b',
 sub:{fr:'Scénographie immersive et interactive',en:'Immersive, interactive scenography'},
 dist:{fr:'Lauréate de la battle inter-écoles EDH, 2025',en:'Winner of the EDH inter-school battle, 2025'},
 p:{fr:['Lumo est une scénographie immersive et interactive pensée pour le Musée des Beaux-Arts de Lyon, autour d’une idée simple&nbsp;: comprendre la lumière en se déplaçant dans l’espace. J’en ai imaginé le concept, l’identité visuelle et l’expérience du visiteur, et le projet a remporté la battle inter-écoles EDH en 2025.','La salle se découpe en zones de couleur&nbsp;: un tapis bleu avec des assises rondes, un îlot rose avec sa banquette, un coin jaune et son étagère ondulée. Des volumes circulaires en lattes de bois, percés d’ouvertures, invitent à entrer&nbsp;; une vitrine verte à arcades expose des objets, et des rails de spots au plafond mettent chaque coin en lumière.'],
 en:['Lumo is an immersive, interactive scenography designed for the Musée des Beaux-Arts de Lyon, built on a simple idea: understanding light by moving through space. I came up with the concept, the visual identity and the visitor experience, and the project won the EDH inter-school battle in 2025.','The room is divided into color zones: a blue rug with round seats, a pink island with its bench, a yellow corner with its wavy shelf. Circular volumes made of wooden slats, pierced with openings, invite visitors inside; a green arcaded display case shows objects, and ceiling spotlight tracks bring every corner into the light.']}}};
